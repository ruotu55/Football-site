<!DOCTYPE html>
<!-- PREP PANEL (2026-06-12): this runner no longer plays/records/renders videos —
     it prepares saves (photos, names, voices, data) for the Remotion project at
     ___Remotion___/1_…_Remotion. Run via run_site.bat as always. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Football Quiz Studio - Lineups - PREP PANEL (Remotion)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://flagcdn.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=20260612-prep17" />
  </head>
  <body>
    <!-- Shared debug overlay: collapsible log panel + 🐞 toggle button (bottom-right). -->
    <script src="../.Storage/shared/debug-overlay.js"></script>
    <script src="../.Storage/shared/loading-overlay.js?v=3"></script>
    <script src="../.Storage/shared/modal-layer.js?v=1"></script>
    <!-- Shared deterministic upload schedule + recording-status client (sets
         window.FCSchedule and window.FCRecordingStatus). save-picker.js in
         the Saved tab reads the same store — load before app.js. -->
    <script src="../999_Calander/js/schedule.js?v=20260602-r9mcq"></script>
    <script src="../999_Calander/js/recording-status-client.js?v=20260601-noconsec"></script>
    <div class="app">

      <button type="button" class="panel-fab" id="panel-fab">Show controls</button>
      <button type="button" class="panel-fab btn-save-current-team-fab" id="btn-save-current-team-fab" hidden aria-pressed="false">
        Save team
      </button>
      <button type="button" class="panel-fab prod-btn" id="prod-btn" aria-pressed="false">PROD</button>
      <button type="button" class="panel-fab reveal-btn" id="reveal-btn" aria-pressed="false">Revealed</button>
      <button type="button" class="panel-fab save-to-block-btn" id="save-to-block-btn">💾 Save to save</button>

      <!-- #team-header is moved here after load; in the prep panel it is the
           active-level toolbar (crest controls + name edit). -->
      <div id="team-header-mount" class="team-header-mount"></div>

      <aside class="control-panel" id="control-panel"></aside>
      <aside class="control-panel right-panel" id="right-panel" hidden></aside>

      <main class="stage">
        <div id="stage-main" class="stage-main">
          <div id="prep-root"></div>
        </div>
      </main>

      <div id="modal-container"></div>
      <!-- Screen safe-zone overlay (toggled via "Screen size" control) -->
      <div id="screen-size-overlay" class="screen-size-overlay">
        <div class="screen-size-overlay__frame">
          <div class="screen-size-overlay__margin-left" aria-hidden="true"></div>
          <div class="screen-size-overlay__margin-right" aria-hidden="true"></div>
          <div class="screen-size-overlay__margin-top"></div>
          <div class="screen-size-overlay__margin-bottom"></div>
          <div class="screen-size-overlay__vline screen-size-overlay__vline--left" aria-hidden="true"></div>
          <div class="screen-size-overlay__vline screen-size-overlay__vline--right" aria-hidden="true"></div>
        </div>
      </div>

    </div>

    <script type="module">
      async function loadComponent(url, elementId, isReplace = false) {
        try {
          const response = await fetch(url);
          const html = await response.text();
          const target = document.getElementById(elementId);
          if (isReplace) {
            target.innerHTML = html;
          } else {
            target.insertAdjacentHTML('beforeend', html);
          }
        } catch (err) {
          console.error(`Failed to load ${url}:`, err);
        }
      }

      async function init() {
        await Promise.all([
          loadComponent('html/controls.html', 'control-panel', true),
          loadComponent('html/modals.html', 'modal-container', true)
        ]);

        // Only the pitch partial — it carries #team-header (the active-level
        // toolbar) and the hidden #pitch-wrap shell pitch-render expects.
        await loadComponent('html/pitch.html', 'stage-main');

        const teamHeaderEl = document.getElementById('team-header');
        const teamHeaderMount = document.getElementById('team-header-mount');
        if (teamHeaderEl && teamHeaderMount) {
          teamHeaderMount.appendChild(teamHeaderEl);
        }

        const script = document.createElement('script');
        script.type = 'module';
        script.src = 'js/app.js?v=' + Date.now();
        document.body.appendChild(script);
      }

      init();
    </script>
  </body>
</html>
